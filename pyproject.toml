[tool.black]
line-length = 79
target_version = ['py34', 'py35', 'py36', 'py37']

[tool.isort]
profile = "black"
line_length = 79

[tool.mypy]
check_untyped_defs = "true"
explicit_package_bases = "true"
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
  "*.tests.*",
  "uaclient.conftest",
  "uaclient.testing.*",
  # features/tools/mcp-behave-server/tests/*: its parent directory's name
  # isn't a valid Python identifier (a hyphen), so mypy's package-base
  # inference can't build a *.tests.* -style dotted name for it -- these
  # resolve as a bare `tests.*` instead.
  "tests.*",
]
ignore_errors = "true"

[[tool.mypy.overrides]]
module = [
  "apt_pkg",
  "behave.*",
  "hamcrest",
]
ignore_missing_imports = "true"

[dependency-groups]
dev = [
    "tox>=4.53.1",
    "tox-uv>=1.25.0",
]
