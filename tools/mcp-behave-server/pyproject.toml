[project]
name = "mcp-behave-server"
version = "0.1.0"
description = "Host-side MCP server for running behave tests for ubuntu-pro-client"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.0.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
mcp-behave-server = "behave_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: End-to-end tests that exercise real subprocess-backed MCP flows",
  "long_running: Tests expected to run for minutes",
]
