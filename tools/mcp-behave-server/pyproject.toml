[project]
name = "mcp-behave-server"
version = "0.1.0"
description = "Host-side MCP server for running behave tests for ubuntu-pro-client"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]==1.28.1",
  "uvicorn>=0.30.0",
  "behave>=1.2.6",
  "pydantic>=2,<3",
  "pro-client-features",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
# Versions matched to the repo-root tox envs (see /tox.ini) where pinned.
lint = [
  "black==24.3.0",
  "isort==5.12.0",
  "flake8",
  "mypy",
]

[project.scripts]
mcp-behave-server = "behave_mcp.server:main"

[tool.uv.sources]
pro-client-features = { path = "../../features", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: End-to-end tests that exercise real subprocess-backed MCP flows",
  "long_running: Tests expected to run for minutes",
]

# black/isort discover the *nearest* pyproject.toml to each file, so
# without these this package would silently drift to black's 88-char
# default instead of the repo-wide 79-char convention (see /pyproject.toml).
[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79

[tool.mypy]
# pro-client-features is installed editable via a setuptools finder that
# mypy's import resolution can't see; point it at the source tree instead.
mypy_path = "../.."

[[tool.mypy.overrides]]
# Matches the root pyproject.toml override: behave ships no type stubs.
module = ["behave.*"]
ignore_missing_imports = "true"
