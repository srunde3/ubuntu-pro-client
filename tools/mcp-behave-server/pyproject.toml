[project]
name = "mcp-behave-server"
version = "0.1.0"
description = "Host-side MCP server for running behave tests for ubuntu-pro-client"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.0.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
