[project]
name = "mcp-server-behave"
version = "0.1.0"
description = "Host-side MCP server for running behave tests for ubuntu-pro-client"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]==1.28.1",
  "uvicorn>=0.30.0",
  "behave>=1.2.6",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=7.1.0",
]
# Versions matched to the repo-root tox envs (see /tox.ini) where pinned.
lint = [
  "black==24.3.0",
  "isort==5.12.0",
  "flake8",
  "mypy",
  "import-linter>=2.15",
]

[project.scripts]
mcp-server-behave = "behave_mcp.server:main"
behave-campaign = "behave_campaign.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Two top-level packages ship from this project: the MCP server and the
# campaign record it drives. Listed explicitly so setuptools' flat-layout
# auto-discovery can't quietly drop one when another directory appears here.
[tool.setuptools.packages.find]
include = ["behave_mcp*", "behave_campaign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: End-to-end tests that exercise real subprocess-backed MCP flows",
  "long_running: Tests expected to run for minutes",
  "integration: real components wired together in process: the MCP protocol, the CLI, startup, real behave or the real features/ corpus",
]

# black/isort discover the *nearest* pyproject.toml to each file, so
# without these this package would silently drift to black's 88-char
# default instead of the repo-wide 79-char convention (see /pyproject.toml).
[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79
# Both packages ship from this project. Without this, isort groups them by
# whether they happen to be installed in the running environment, so the
# same file passes in one checkout and fails in another.
known_first_party = ["behave_mcp", "behave_campaign", "tests"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Matches the root pyproject.toml override: behave ships no type stubs.
module = ["behave.*"]
ignore_missing_imports = "true"

# Run with `uv run lint-imports`. Each contract is a rule from AGENTS.md.
[tool.importlinter]
root_packages = ["behave_mcp", "behave_campaign"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "behave_mcp imports behave_campaign only in the server.py tool handlers"
type = "forbidden"
source_modules = ["behave_mcp"]
forbidden_modules = ["behave_campaign"]
ignore_imports = ["behave_mcp.server -> behave_campaign.**"]

[[tool.importlinter.contracts]]
name = "behave_campaign uses only parser, domain.pools and domain.layout from behave_mcp; its CLI also builds the job service"
type = "forbidden"
source_modules = ["behave_campaign"]
forbidden_modules = [
  "behave_mcp.adapters",
  "behave_mcp.config",
  "behave_mcp.domain.jobs",
  "behave_mcp.domain.limits",
  "behave_mcp.domain.logs",
  "behave_mcp.domain.report",
  "behave_mcp.messages",
  "behave_mcp.ports",
  "behave_mcp.server",
  "behave_mcp.service",
  "behave_mcp.views",
]
# Every front-end configures the checkout and reconciles its jobs, so the
# CLI builds the job service from its adapters, as the server does.
ignore_imports = [
  "behave_campaign.cli -> behave_mcp.adapters",
  "behave_campaign.cli -> behave_mcp.service",
]

[[tool.importlinter.contracts]]
name = "behave_mcp layers"
type = "layers"
containers = ["behave_mcp"]
layers = [
  "server | job_process",
  "service | adapters",
  "ports | config | views",
  "parser",
  "domain",
  "messages",
]

[[tool.importlinter.contracts]]
name = "behave_campaign layers"
type = "layers"
containers = ["behave_campaign"]
layers = [
  "cli",
  "service | adapters | repo",
  "views | ports",
  "domain | messages",
]

[[tool.importlinter.contracts]]
name = "Domain and service modules do no direct I/O"
type = "forbidden"
source_modules = [
  "behave_mcp.domain",
  "behave_mcp.service",
  "behave_mcp.views",
  "behave_campaign.domain",
  "behave_campaign.service",
  "behave_campaign.views",
]
forbidden_modules = [
  "fcntl",
  "gzip",
  "os",
  "signal",
  "subprocess",
  "tarfile",
  "tempfile",
]

[[tool.importlinter.contracts]]
name = "Only server.py imports the MCP framework"
type = "forbidden"
source_modules = ["behave_mcp", "behave_campaign"]
forbidden_modules = ["mcp", "starlette", "uvicorn"]
ignore_imports = [
  "behave_mcp.server -> mcp",
  "behave_mcp.server -> starlette",
]

# A signal, not a gate: no fail_under. `--cov` prints branch coverage and
# the lines each file misses.
[tool.coverage.run]
branch = true
source = ["behave_mcp", "behave_campaign"]

[tool.coverage.report]
show_missing = true
skip_covered = true
