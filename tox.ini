[tox]
# Workshop uses `uv` to manage the Python installation
requires = tox-uv
envlist = test, flake8, mypy, black, isort, reformat-gherkin, shellcheck

[testenv:test]
# Use python3-apt from the host
system_site_packages = true
deps: -rrequirements.test.txt
commands: py.test --junitxml=pytest_results.xml {posargs:--cov uaclient uaclient}

[testenv:tools-test]
deps: -rrequirements.test.txt
commands: py.test features/tests features/tools/tests

[testenv:flake8]
skip_install = true
deps: flake8
commands: flake8 uaclient lib setup.py features

[testenv:mypy]
skip_install = true
deps =
    mypy
    types-paramiko
    types-pycurl
    types-PyYAML
    types-requests
    types-toml
    # features/tools/mcp-behave-server/ pins these in its own pyproject.toml;
    # kept in sync here so mypy can actually check imports against them
    # instead of reporting "Cannot find implementation or library stub".
    pydantic>=2,<3
    mcp[cli]==1.28.1
    uvicorn>=0.30.0
commands: mypy uaclient/ features/ lib/

[testenv:black]
skip_install = true
# The following version is also in .pre-commit-config.yaml;
# make sure to update both together
deps: black==24.3.0
commands: black --check --diff uaclient/ features/ lib/ setup.py

[testenv:isort]
skip_install = true
# The following version is also in .pre-commit-config.yaml;
# make sure to update both together
deps: isort==5.12.0
commands: isort --check --diff uaclient/ features/ lib/ setup.py

[testenv:reformat-gherkin]
skip_install = true
# The following version is also in .pre-commit-config.yaml;
# make sure to update both together
deps: reformat-gherkin==3.0.1
commands: reformat-gherkin --check features/

[testenv:shellcheck]
skip_install = true
allowlist_externals=/usr/bin/bash
# The following version is also in .pre-commit-config.yaml;
# make sure to update both together
deps: shellcheck-py==0.9.0.6
commands: bash -O extglob -O nullglob -c "shellcheck -S warning tools/*.sh debian/*.{config,postinst,postrm,prerm} lib/*.sh sru/*.sh update-motd.d/*"

[testenv:bandit]
deps: bandit
commands: bandit -r {posargs:uaclient lib apport}

[testenv:pylint]
deps: pylint
commands: pylint {posargs:uaclient lib apport}

[testenv:behave]
deps =
    behave
    jsonschema
    jq
    pycloudlib>=1!10.18.0,<1!11
    azure-mgmt-network<31  # https://github.com/canonical/pycloudlib/issues/501
    azure-mgmt-compute<38  # https://github.com/canonical/pycloudlib/issues/511
    PyHamcrest
    requests
    toml==0.10
    ipdb
passenv =
    PYCLOUDLIB_CONFIG
    GCE_CREDENTIALS_PATH
    AZURE_CONFIG_DIR
    UACLIENT_BEHAVE_*
    https_proxy
commands: behave -v {posargs}

[flake8]
# E251: Older versions of flake8 et al don't permit the
#       now-recommended-by-PEP-8 parameter spacing for annotated function
#       arguments with defaults (e.g.  `def spam(ham: str = "eggs"):`).
# E203/W503:
#       Per https://black.readthedocs.io/en/stable/the_black_code_style.html,
#       W503 and E203 are not PEP 8 compliant and are therefore incompatible
#       with black.
ignore = E203,E251,W503
# features/tools/mcp-behave-server/ gets its own venv locally (via `uv run`)
# for its isolated dependencies (pydantic, mcp, uvicorn); unlike the repo's
# top-level .tox/.venv, it can end up nested under `features/`, which flake8
# would otherwise walk into and lint as if it were our own source.
exclude = .venv
# These test files embed literal Gherkin fixture text (a real `Given a
# `<release>` `<machine_type>` machine ...` step, mirroring the exact
# wording features/environment.py matches on) that can't be wrapped without
# changing what's being tested -- Gherkin steps are single physical lines.
per-file-ignores =
    features/tests/test_behave_features.py:E501
    features/tools/mcp-behave-server/tests/test_adapters.py:E501
    features/tools/mcp-behave-server/tests/test_server.py:E501

[pytest]
log_format = %(filename)-25s %(lineno)4d %(levelname)-8s %(message)s
filterwarnings = ignore::DeprecationWarning

[behave]
logging_level=info
logging_format=%(asctime)s:%(levelname)s:%(name)s:%(message)s
log_capture=no
stdout_capture=no
stderr_capture=no
show_skipped=no
junit=true
