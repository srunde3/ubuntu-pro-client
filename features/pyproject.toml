[project]
name = "pro-client-features"
version = "0.0.1"
description = "Structural/parsing layer for the ubuntu-pro-client e2e feature suite -- .feature file conventions (behave_features.py) and @releases.* tag semantics (tools/), shared by coverage_gaps.py and mcp-behave-server."
requires-python = ">=3.10"
dependencies = [
    "behave>=1.2.6",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

# `features/` also holds this repo's actual behave runtime support
# (cloud.py, environment.py, util.py, steps/) alongside the parsing layer
# this package is scoped to. Those ride along in the wheel too, since
# setuptools packages at the directory level -- harmless, since nothing in
# behave_features.py/tools/ imports them and they're never eagerly loaded.
[tool.setuptools]
packages = ["features", "features.tools"]
package-dir = {"features" = "."}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# black/isort discover the *nearest* pyproject.toml to each file, so
# without these this package would silently drift to black's 88-char
# default instead of the repo-wide 79-char convention (see /pyproject.toml).
[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79
