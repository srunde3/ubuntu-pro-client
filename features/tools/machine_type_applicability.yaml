# FIPS cloud images: offered xenial-focal, not offered since jammy. Not a
# permanent retirement -- may resume on a future release -- so this list is
# evaluated as of today like status(r), not a one-time historical fact.
aws.pro-fips:
  - xenial
  - bionic
  - focal

azure.pro-fips:
  - xenial
  - bionic
  - focal

# Never offered on xenial; otherwise same history as aws/azure.pro-fips.
gcp.pro-fips:
  - bionic
  - focal

# WSL: offered bionic through jammy only.
wsl:
  - bionic
  - focal
  - jammy
